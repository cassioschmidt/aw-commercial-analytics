name: sqlfmt

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sqlfmt:
    name: sqlfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install sqlfmt
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: sqlfmt --check --diff .
