version: 2
sources:
  - name: adventure_works
    description: AdventureWorks tables loaded as CSV files from Google Drive by Fivetran (Magic Folder, one table per file). Kept exactly as loaded.
    database: raw
    schema: adventure_works
    config:
      loaded_at_field: _fivetran_synced
      freshness:
        warn_after: {count: 95, period: day}
        error_after: {count: 120, period: day}
    tables:
      - name: sales_salesorderheader
        description: 'Sales orders, one row per order. Expected arrival: monthly, with the sales extract (transactional data).'
        columns:
          - name: salesorderid
            data_tests:
              - unique
              - not_null
          - name: orderdate
            data_tests:
              - not_null
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - 1
                      - 2
                      - 3
                      - 4
                      - 5
                      - 6
                    quote: false
          - name: onlineorderflag
            data_tests:
              - not_null
          - name: customerid
            data_tests:
              - not_null
          - name: subtotal
            data_tests:
              - not_null
              - non_negative
          - name: taxamt
            data_tests:
              - not_null
              - non_negative
          - name: freight
            data_tests:
              - not_null
              - non_negative
          - name: totaldue
            data_tests:
              - not_null
              - non_negative
        config:
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 45, period: day}
            filter: _fivetran_synced >= dateadd('day', -45, current_timestamp())
      - name: sales_salesorderdetail
        description: 'Order lines, one row per product in each sales order. Expected arrival: monthly, with the sales extract (transactional data).'
        columns:
          - name: salesorderdetailid
            data_tests:
              - unique
              - not_null
          - name: salesorderid
            data_tests:
              - not_null
          - name: orderqty
            data_tests:
              - not_null
          - name: productid
            data_tests:
              - not_null
          - name: specialofferid
            data_tests:
              - not_null
          - name: unitprice
            data_tests:
              - not_null
          - name: unitpricediscount
            data_tests:
              - not_null
        config:
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 45, period: day}
            filter: _fivetran_synced >= dateadd('day', -45, current_timestamp())
      - name: sales_customer
        description: 'Customers, either a person or a store. Expected arrival: quarterly (master data that changes slowly).'
        columns:
          - name: customerid
            data_tests:
              - unique
              - not_null
        config:
          freshness:
            warn_after: {count: 95, period: day}
            error_after: {count: 120, period: day}
            filter: _fivetran_synced >= dateadd('day', -120, current_timestamp())
      - name: sales_salesperson
        description: 'Sales people, with quota, bonus and commission. Expected arrival: quarterly (master data that changes slowly).'
        columns:
          - name: businessentityid
            data_tests:
              - unique
              - not_null
      - name: sales_store
        description: 'Stores that buy from the company. Expected arrival: quarterly (master data that changes slowly).'
        columns:
          - name: businessentityid
            data_tests:
              - unique
              - not_null
      - name: sales_specialoffer
        description: 'Discounts and promotions. Expected arrival: quarterly (master data that changes slowly).'
        columns:
          - name: specialofferid
            data_tests:
              - unique
              - not_null
          - name: discountpct
            data_tests:
              - not_null
      - name: sales_salesreason
        description: 'Reasons why customers buy. Expected arrival: yearly (reference data that rarely changes).'
        columns:
          - name: salesreasonid
            data_tests:
              - unique
              - not_null
          - name: reasontype
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - Other
                      - Promotion
                      - Marketing
        config:
          freshness:
            warn_after: {count: 380, period: day}
            error_after: {count: 400, period: day}
      - name: sales_salesorderheadersalesreason
        description: 'Links sales orders to the reasons for the purchase. Expected arrival: monthly, with the sales extract (transactional data).'
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - salesorderid
                  - salesreasonid
        config:
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 45, period: day}
            filter: _fivetran_synced >= dateadd('day', -45, current_timestamp())
      - name: sales_salespersonquotahistory
        description: 'Sales quota of each sales person over time. Expected arrival: quarterly (master data that changes slowly).'
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - businessentityid
                  - quotadate
        columns:
          - name: salesquota
            data_tests:
              - not_null
      - name: sales_salesterritoryhistory
        description: 'Sales territory assignments of each sales person over time. Expected arrival: quarterly (master data that changes slowly).'
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - businessentityid
                  - territoryid
                  - startdate
      - name: sales_salesterritory
        description: 'Sales territories. Expected arrival: yearly (reference data that rarely changes).'
        columns:
          - name: territoryid
            data_tests:
              - unique
              - not_null
        config:
          freshness:
            warn_after: {count: 380, period: day}
            error_after: {count: 400, period: day}
      - name: sales_creditcard
        description: 'Credit cards used for sales. Contains sensitive payment data. Expected arrival: quarterly (master data that changes slowly).'
        columns:
          - name: creditcardid
            data_tests:
              - unique
              - not_null
          - name: cardtype
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - Vista
                      - SuperiorCard
                      - Distinguish
                      - ColonialVoice
        config:
          freshness:
            warn_after: {count: 95, period: day}
            error_after: {count: 120, period: day}
            filter: _fivetran_synced >= dateadd('day', -120, current_timestamp())
      - name: sales_currency
        description: 'Currencies, by ISO code. Expected arrival: yearly (reference data that rarely changes).'
        columns:
          - name: currencycode
            data_tests:
              - unique
              - not_null
        config:
          freshness:
            warn_after: {count: 380, period: day}
            error_after: {count: 400, period: day}
      - name: sales_currencyrate
        description: 'Daily exchange rates between currencies. Expected arrival: monthly, with the sales extract (transactional data).'
        columns:
          - name: currencyrateid
            data_tests:
              - unique
              - not_null
          - name: averagerate
            data_tests:
              - not_null
          - name: endofdayrate
            data_tests:
              - not_null
        config:
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 45, period: day}
            filter: _fivetran_synced >= dateadd('day', -45, current_timestamp())
      - name: sales_countryregioncurrency
        description: 'Currency used by each country or region. Expected arrival: quarterly (master data that changes slowly).'
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - countryregioncode
                  - currencycode
      - name: sales_specialofferproduct
        description: 'Links special offers to the products they apply to. Expected arrival: quarterly (master data that changes slowly).'
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - specialofferid
                  - productid
      - name: production_product
        description: 'Products sold or used in manufacturing. Expected arrival: quarterly (master data that changes slowly).'
        columns:
          - name: productid
            data_tests:
              - unique
              - not_null
          - name: productnumber
            data_tests:
              - unique
              - not_null
          - name: name
            data_tests:
              - not_null
          - name: makeflag
            data_tests:
              - not_null
          - name: finishedgoodsflag
            data_tests:
              - not_null
          - name: standardcost
            data_tests:
              - not_null
          - name: listprice
            data_tests:
              - not_null
      - name: production_productsubcategory
        description: 'Product subcategories, each inside a category. Expected arrival: yearly (reference data that rarely changes).'
        columns:
          - name: productsubcategoryid
            data_tests:
              - unique
              - not_null
          - name: productcategoryid
            data_tests:
              - not_null
          - name: name
            data_tests:
              - not_null
        config:
          freshness:
            warn_after: {count: 380, period: day}
            error_after: {count: 400, period: day}
      - name: production_productcategory
        description: 'Top level product categories. Expected arrival: yearly (reference data that rarely changes).'
        columns:
          - name: productcategoryid
            data_tests:
              - unique
              - not_null
          - name: name
            data_tests:
              - not_null
        config:
          freshness:
            warn_after: {count: 380, period: day}
            error_after: {count: 400, period: day}
      - name: production_productcosthistory
        description: 'Standard cost of each product over time. Expected arrival: quarterly (master data that changes slowly).'
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - productid
                  - startdate
        columns:
          - name: standardcost
            data_tests:
              - not_null
      - name: production_scrapreason
        description: 'Reasons why manufactured items are scrapped. Expected arrival: yearly (reference data that rarely changes).'
        columns:
          - name: scrapreasonid
            data_tests:
              - unique
              - not_null
          - name: name
            data_tests:
              - not_null
        config:
          freshness:
            warn_after: {count: 380, period: day}
            error_after: {count: 400, period: day}
      - name: production_workorder
        description: 'Manufacturing work orders. Expected arrival: monthly, with the sales extract (transactional data).'
        columns:
          - name: workorderid
            data_tests:
              - unique
              - not_null
          - name: productid
            data_tests:
              - not_null
          - name: orderqty
            data_tests:
              - not_null
          - name: startdate
            data_tests:
              - not_null
        config:
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 45, period: day}
            filter: _fivetran_synced >= dateadd('day', -45, current_timestamp())
      - name: person_person
        description: 'People, such as customers, employees and contacts. Expected arrival: quarterly (master data that changes slowly).'
        columns:
          - name: businessentityid
            data_tests:
              - unique
              - not_null
          - name: persontype
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - IN
                      - SC
                      - SP
                      - EM
                      - VC
                      - GC
          - name: firstname
            data_tests:
              - not_null
          - name: lastname
            data_tests:
              - not_null
          - name: emailpromotion
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - 0
                      - 1
                      - 2
                    quote: false
        config:
          freshness:
            warn_after: {count: 95, period: day}
            error_after: {count: 120, period: day}
            filter: _fivetran_synced >= dateadd('day', -120, current_timestamp())
      - name: person_address
        description: 'Street addresses of customers, employees and vendors. Expected arrival: quarterly (master data that changes slowly).'
        columns:
          - name: addressid
            data_tests:
              - unique
              - not_null
          - name: city
            data_tests:
              - not_null
          - name: stateprovinceid
            data_tests:
              - not_null
          - name: postalcode
            data_tests:
              - not_null
        config:
          freshness:
            warn_after: {count: 95, period: day}
            error_after: {count: 120, period: day}
            filter: _fivetran_synced >= dateadd('day', -120, current_timestamp())
      - name: person_stateprovince
        description: 'States and provinces, with the sales territory of each. Expected arrival: yearly (reference data that rarely changes).'
        columns:
          - name: stateprovinceid
            data_tests:
              - unique
              - not_null
          - name: countryregioncode
            data_tests:
              - not_null
          - name: name
            data_tests:
              - not_null
          - name: territoryid
            data_tests:
              - not_null
        config:
          freshness:
            warn_after: {count: 380, period: day}
            error_after: {count: 400, period: day}
      - name: person_countryregion
        description: 'Countries and regions, by ISO code. Expected arrival: yearly (reference data that rarely changes).'
        columns:
          - name: countryregioncode
            data_tests:
              - unique
              - not_null
          - name: name
            data_tests:
              - not_null
        config:
          freshness:
            warn_after: {count: 380, period: day}
            error_after: {count: 400, period: day}