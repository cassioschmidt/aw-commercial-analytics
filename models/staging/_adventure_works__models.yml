version: 2

models:
  - name: stg_adventure_works__sales_salesorderheader
    description: Sales orders, one row per order.
    columns:
      - name: sales_order_id
        description: Primary key of the sales order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_customer')
                field: customer_id
      - name: territory_id
        description: Sales territory of the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesterritory')
                field: territory_id
      - name: sales_person_id
        description: Sales person of the order. Empty for online orders.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesperson')
                field: sales_person_id
      - name: bill_to_address_id
        description: Billing address of the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_address')
                field: address_id
      - name: ship_to_address_id
        description: Shipping address of the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_address')
                field: address_id

  - name: stg_adventure_works__sales_salesorderdetail
    description: Sales order lines, one row per product in each order.
    columns:
      - name: sales_order_detail_id
        description: Primary key of the order line.
        data_tests:
          - unique
          - not_null
      - name: sales_order_id
        description: Order that the line belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesorderheader')
                field: sales_order_id
      - name: product_id
        description: Product sold in the line.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_product')
                field: product_id
      - name: special_offer_id
        description: Special offer applied to the line.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_specialoffer')
                field: special_offer_id

  - name: stg_adventure_works__sales_customer
    description: Customers, either a person or a store.
    columns:
      - name: customer_id
        description: Primary key of the customer.
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: Person behind the customer. Empty for store customers.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_person')
                field: person_id
      - name: store_id
        description: Store behind the customer. Empty for individual customers.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_store')
                field: store_id

  - name: stg_adventure_works__production_product
    description: Products sold or used in manufacturing.
    columns:
      - name: product_id
        description: Primary key of the product.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__sales_salesterritory
    description: Sales territories.
    columns:
      - name: territory_id
        description: Primary key of the sales territory.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__sales_salesperson
    description: Sales people, with quota, bonus and commission.
    columns:
      - name: sales_person_id
        description: Primary key of the sales person.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__person_person
    description: People, such as customers, employees and contacts.
    columns:
      - name: person_id
        description: Primary key of the person.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__sales_store
    description: Stores that buy from the company.
    columns:
      - name: store_id
        description: Primary key of the store.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__person_address
    description: Street addresses.
    columns:
      - name: address_id
        description: Primary key of the address.
        data_tests:
          - unique
          - not_null
      - name: state_province_id
        description: State or province of the address.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_stateprovince')
                field: state_province_id

  - name: stg_adventure_works__person_stateprovince
    description: States and provinces.
    columns:
      - name: state_province_id
        description: Primary key of the state or province.
        data_tests:
          - unique
          - not_null
      - name: country_region_code
        description: Country or region of the state or province.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_countryregion')
                field: country_region_code

  - name: stg_adventure_works__person_countryregion
    description: Countries and regions, by ISO code.
    columns:
      - name: country_region_code
        description: Primary key of the country or region.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__sales_specialoffer
    description: Discounts and promotions.
    columns:
      - name: special_offer_id
        description: Primary key of the special offer.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__sales_salesreason
    description: Reasons why customers buy.
    columns:
      - name: sales_reason_id
        description: Primary key of the sales reason.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__sales_salesorderheadersalesreason
    description: Links sales orders to the reasons for the purchase.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_order_id
              - sales_reason_id
    columns:
      - name: sales_order_id
        description: Order of the link.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesorderheader')
                field: sales_order_id
      - name: sales_reason_id
        description: Reason of the link.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesreason')
                field: sales_reason_id

  - name: stg_adventure_works__production_productcosthistory
    description: Standard cost of each product over time.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_id
              - start_date
    columns:
      - name: product_id
        description: Product that the cost applies to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_product')
                field: product_id
      - name: standard_cost
        description: Standard cost of one unit in the period.
        data_tests:
          - not_null

  - name: stg_adventure_works__sales_salespersonquotahistory
    description: Sales quota of each sales person over time.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_person_id
              - quota_date
    columns:
      - name: sales_person_id
        description: Sales person that the quota belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesperson')
                field: sales_person_id

  - name: stg_adventure_works__sales_salesterritoryhistory
    description: Sales territory assignments of each sales person over time.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_person_id
              - territory_id
              - start_date
    columns:
      - name: sales_person_id
        description: Sales person assigned to the territory.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesperson')
                field: sales_person_id
      - name: territory_id
        description: Territory covered in the period.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesterritory')
                field: territory_id

  - name: stg_adventure_works__sales_creditcard
    description: Credit cards used for sales. Contains sensitive payment data.
    columns:
      - name: credit_card_id
        description: Primary key of the credit card.
        data_tests:
          - unique
          - not_null
      - name: card_type
        description: Brand of the credit card.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Vista
                  - SuperiorCard
                  - Distinguish
                  - ColonialVoice
      - name: card_number
        description: Credit card number. Sensitive payment data, never exposed in marts.
        config:
          meta:
            sensitivity: payment

  - name: stg_adventure_works__sales_currency
    description: Currencies, by ISO code.
    columns:
      - name: currency_code
        description: Primary key of the currency, the ISO code.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__sales_currencyrate
    description: Daily exchange rates between currencies.
    columns:
      - name: currency_rate_id
        description: Primary key of the exchange rate.
        data_tests:
          - unique
          - not_null
      - name: from_currency_code
        description: Currency being converted from.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_currency')
                field: currency_code
      - name: to_currency_code
        description: Currency being converted to.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_currency')
                field: currency_code

  - name: stg_adventure_works__sales_countryregioncurrency
    description: Currency used by each country or region.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_region_code
              - currency_code
    columns:
      - name: country_region_code
        description: Country or region.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_countryregion')
                field: country_region_code
      - name: currency_code
        description: Currency used in the country or region.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_currency')
                field: currency_code

  - name: stg_adventure_works__production_scrapreason
    description: Reasons why manufactured items are scrapped.
    columns:
      - name: scrap_reason_id
        description: Primary key of the scrap reason.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__production_workorder
    description: Manufacturing work orders.
    columns:
      - name: work_order_id
        description: Primary key of the work order.
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: Product being manufactured.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_product')
                field: product_id
      - name: scrap_reason_id
        description: Reason for scrap. Empty when nothing was scrapped.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_scrapreason')
                field: scrap_reason_id

  - name: stg_adventure_works__sales_specialofferproduct
    description: Links special offers to the products they apply to.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - special_offer_id
              - product_id
    columns:
      - name: special_offer_id
        description: Special offer of the link.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_specialoffer')
                field: special_offer_id
      - name: product_id
        description: Product of the link.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_product')
                field: product_id

  - name: stg_adventure_works__production_productcategory
    description: Top level product categories.
    columns:
      - name: product_category_id
        description: Primary key of the product category.
        data_tests:
          - unique
          - not_null

  - name: stg_adventure_works__production_productsubcategory
    description: Product subcategories, each inside a category.
    columns:
      - name: product_subcategory_id
        description: Primary key of the product subcategory.
        data_tests:
          - unique
          - not_null
      - name: product_category_id
        description: Category that the subcategory belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_productcategory')
                field: product_category_id